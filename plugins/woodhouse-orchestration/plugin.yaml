name: woodhouse-orchestration
version: "0.1.0"
description: "Strict-tag intake for Woodhouse multi-agent orchestration: parses [project][workstream] @agent tags on inbound gateway messages and normalizes them for deliberate broker dispatch. Provides the woodhouse toolset (woodhouse_dispatch, woodhouse_task_status, woodhouse_kanban_list) which talks to the Woodhouse broker over a local unix socket (~/.woodhouse/broker.sock) — no shell, no file writes."
author: Woodhouse
hooks:
  - pre_gateway_dispatch
provides_tools:
  - woodhouse_dispatch
  - woodhouse_task_status
  - woodhouse_kanban_list
